<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Millquas Productions</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&display=swap">
<style>
:root { --bg: #141216; --fg: #f2eee5; --accent: #e2505c; color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
  font: 1rem/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { display: grid; gap: 1rem; justify-items: center; }
img { width: 96px; height: 96px; }
h1 { margin: 0; font: 700 clamp(2rem, 8vw, 3rem)/1.05 "Barlow Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .03em; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Millquas Productions</h1>
  <a href="privacy">Crosspost privacy policy</a>
</main>
</body>
</html>
